name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316

      - name: Valider le plugin et la marketplace
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate . --strict

      - name: Tests des hooks
        run: tests/hooks/run.sh

      - name: Syntaxe des scripts shell
        run: |
          for f in scripts/*.sh hooks/scripts/*.sh tests/hooks/*.sh tests/validate/*.sh evals/_fixtures/*.sh evals/cases/*/scaffold.sh; do
            bash -n "$f"
          done
